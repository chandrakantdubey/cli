name: Release Linux CLI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build release archives
        shell: bash
        run: |
          if [[ ! $RELEASE_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            printf 'Expected a release tag such as v0.1.0\n' >&2
            exit 1
          fi
          make package VERSION="${RELEASE_TAG#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-silly-release
          path: artifacts/releases/
          if-no-files-found: error

  verify-install:
    needs: build
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cli-silly-release
          path: artifacts/releases/
      - name: Verify installation on the native runner
        run: bash scripts/test-install.sh "${RELEASE_TAG#v}"

  release:
    needs: verify-install
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cli-silly-release
          path: artifacts/releases/
      - name: Publish verified files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${RELEASE_TAG#v}
          flags=(--verify-tag --generate-notes)
          if [[ $version == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}" \
            "artifacts/releases/install.sh" \
            "artifacts/releases/SHA256SUMS-$version.txt" \
            "artifacts/releases/cli-silly-$version-linux-amd64.tar.gz" \
            "artifacts/releases/cli-silly-$version-linux-arm64.tar.gz" \
            "artifacts/releases/markdown-basics-v1.tar.gz"
