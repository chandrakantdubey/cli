name: silly-standalone
services:
  api:
    build: .
    ports:
      - "127.0.0.1::8080"
    volumes:
      - release-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 2s
      timeout: 1s
      retries: 10
volumes:
  release-data:
